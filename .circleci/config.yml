version: 2.1
jobs:
  cli-test:
    machine:
      image: ubuntu-2204:current
    steps:
      - run: curl -fsSL https://opencode.ai/install | bash
      - run: |
          export PATH="$HOME/.opencode/bin:$PATH"
          IP=$(curl -s -m 20 https://api.ipify.org)
          echo "IP=$IP"
          timeout 90 opencode run --model "opencode/deepseek-v4.1-flash-free" "Say hi" 2>&1 | tail -c 500
          echo "EXIT:$?"
workflows:
  test:
    jobs:
      - cli-test
