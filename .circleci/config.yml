version: 2.1
jobs:
  test-opencode:
    machine:
      image: ubuntu-2204:current
    steps:
      - run:
          name: Check IP and test opencode.ai
          command: |
            echo "=== Runner IP ==="
            curl -s -m 20 https://api.ipify.org; echo
            echo "=== Test opencode.ai free model ==="
            curl -s -m 60 -X POST https://opencode.ai/zen/v1/chat/completions \
              -H "x-opencode-client: desktop" \
              -H "Content-Type: application/json" \
              -d '{"model":"deepseek-v4.1-flash-free","messages":[{"role":"user","content":"hi"}],"max_tokens":5}' \
              | head -c 500; echo
            echo "=== Done ==="
      - run:
          name: Keep alive for 4 hours
          command: sleep 14400
workflows:
  test:
    jobs:
      - test-opencode
